services:
  database:
    container_name: pet-expressions-db
    build: ./database
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=pet_expressions
      - MYSQL_TCP_PORT=3306
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  inference:
    container_name: pet-expressions-inference
    build: ./inference
    environment:
      SQS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      SQS_REGION: us-east-1
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy
      localstack:
        condition: service_healthy

  localstack:
    container_name: pet-expressions-localstack
    image: localstack/localstack:4.4.0
    ports:
      - 4566:4566
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
